# Public www.quukk.com traffic reaches 113 via the existing 47 ingress on :8484.
# Install as sites-enabled/zz-quukk-company to preserve existing default servers.
server {
    listen 80;
    listen [::]:80;
    listen 7680;
    listen [::]:7680;
    server_name quukk.com www.quukk.com;
    return 301 https://www.quukk.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 8484 ssl;
    listen [::]:8484 ssl;
    server_name www.quukk.com;

    # This wildcard covers www.quukk.com, but not the apex quukk.com.
    ssl_certificate /etc/nginx/ssl/_.quukk.com_chain.pem;
    ssl_certificate_key /etc/nginx/ssl/_.quukk.com_key.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    root /var/www/quukk-company/current;
    index index.html;
    charset utf-8;
    # Keep directory redirects relative behind the public ingress on :443.
    absolute_redirect off;

    access_log /var/log/nginx/quukk-company-access.log;
    error_log /var/log/nginx/quukk-company-error.log warn;

    # Asset filenames are stable between releases, so revalidate them.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
